name: Update GTFS static data

on:
  schedule:
    # Weekly (Mondays 06:00 UTC) - LTC's static schedule feed changes a few
    # times a year at most (seasonal service changes), not daily.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Download LTC static GTFS feed
        run: |
          curl -sSL -o gtfs.zip https://www.londontransit.ca/gtfsfeed/google_transit.zip
          mkdir -p gtfs-extracted
          unzip -q gtfs.zip -d gtfs-extracted

      - name: Regenerate stops.json / routes.json
        run: node scripts/gtfs-static/update.mjs gtfs-extracted client/public

      - name: Commit changes if the feed actually changed
        run: |
          if git diff --quiet -- client/public/stops.json client/public/routes.json; then
            echo "No changes to stops.json / routes.json — feed is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/public/stops.json client/public/routes.json
          git commit -m "Update stops.json/routes.json from LTC static GTFS feed"
          git push
